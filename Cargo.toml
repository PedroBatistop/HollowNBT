[package]
name = "hollow-nbt"
version = "0.1.0"
edition = "2024"
description = "Create/Vanilla NBT external-shell optimizer with Windows GUI"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
fastnbt = "2.6.3"
flate2 = "1.1.10"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
