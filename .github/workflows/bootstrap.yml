name: Bootstrap HollowNBT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path unpacked | Out-Null
          Expand-Archive -Path HollowNBT-source.zip -DestinationPath unpacked -Force

      - name: Build Windows release
        shell: pwsh
        run: |
          cargo build --release --manifest-path unpacked/hollow_nbt_rust/Cargo.toml
          Copy-Item unpacked/hollow_nbt_rust/target/release/hollow-nbt.exe HollowNBT.exe

      - uses: actions/upload-artifact@v4
        with:
          name: HollowNBT-Windows-x64
          path: HollowNBT.exe
          if-no-files-found: error

      - name: Publish source into repository
        shell: pwsh
        run: |
          $src = "unpacked/hollow_nbt_rust"
          Copy-Item "$src/Cargo.toml" "Cargo.toml" -Force
          Copy-Item "$src/Cargo.lock" "Cargo.lock" -Force
          Copy-Item "$src/.gitignore" ".gitignore" -Force
          Copy-Item "$src/README.md" "README.md" -Force
          Copy-Item "$src/src" "src" -Recurse -Force
          Remove-Item -Recurse -Force unpacked
          Remove-Item -Force HollowNBT-source.zip
          if (Test-Path ".build-trigger") { Remove-Item -Force ".build-trigger" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .gitignore README.md src HollowNBT-source.zip .build-trigger
          git commit -m "Add Rust source [skip ci]"
          git push
